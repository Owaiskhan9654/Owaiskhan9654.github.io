<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f1a" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#7c6cff" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary Meta -->
    <title>Owais Ahmad — AI &amp; Data Science Manager</title>
    <meta
      name="description"
      content="Owais Ahmad — AI & Data Science Manager with 7+ years building enterprise Generative AI, LLM, and MLOps systems. TIME100 AI 2025 Honoree."
    />
    <meta name="author" content="Owais Ahmad" />
    <meta
      name="keywords"
      content="Owais Ahmad, AI Engineer, Generative AI, LLM, MLOps, RAG, Agentic AI, Data Scientist, watsonx, Azure OpenAI, Machine Learning"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Owais Ahmad — AI & Data Science Manager" />
    <meta
      property="og:description"
      content="7+ years building enterprise Generative AI, LLM & MLOps systems. TIME100 AI 2025 Honoree."
    />
    <meta property="og:url" content="https://owaiskhan9654.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply saved theme before paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
